name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: HTML, CSS, and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install linters
        run: npm install --no-save htmlhint stylelint stylelint-config-standard eslint

      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      - name: Lint CSS
        run: npx stylelint "**/*.css"

      - name: Lint JavaScript
        run: npx eslint "**/*.js"
