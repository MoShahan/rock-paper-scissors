# Discord / Telegram alerts after GitHub Pages deploy succeeds or fails.
#
# Does not notify on cancelled, skipped, or in-progress runs, and does not
# listen to lint/test workflows. Missing secrets skip that channel instead
# of failing, so this file is safe to copy into other repos.
#
# Optional secrets (configure whichever channels you want):
#   DISCORD_WEBHOOK_URL
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
#
# If your deploy workflow uses a different `name:`, update `workflows:` below.

name: Notify GitHub Pages

on:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Send deploy alerts
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'
    steps:
      - name: Notify Discord and Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          TRIGGER: ${{ github.event.workflow_run.event }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_FULL_NAME: ${{ github.event.repository.full_name }}
          REPO_URL: ${{ github.event.repository.html_url }}
          REPO_HOMEPAGE: ${{ github.event.repository.homepage }}
          OWNER: ${{ github.event.repository.owner.login }}
        shell: bash
        run: |
          set +e
          set +o pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          html_escape() {
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' -e 's/"/\&quot;/g'
          }

          TELEGRAM_BOT_TOKEN="$(trim "$TELEGRAM_BOT_TOKEN")"
          TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN#bot}"
          TELEGRAM_CHAT_ID="$(trim "$TELEGRAM_CHAT_ID")"
          DISCORD_WEBHOOK_URL="$(trim "$DISCORD_WEBHOOK_URL")"
          BRANCH="$(trim "${BRANCH:-unknown}")"
          ACTOR="$(trim "${ACTOR:-unknown}")"
          SHA="$(trim "$SHA")"
          TITLE="$(trim "$TITLE")"
          REPO_HOMEPAGE="$(trim "$REPO_HOMEPAGE")"

          case "$CONCLUSION" in
            success)
              EMOJI="✅"
              STATUS_LABEL="Success"
              HEADLINE="GitHub Pages deployed"
              DISCORD_COLOR="2278750"
              ;;
            timed_out)
              EMOJI="⏰"
              STATUS_LABEL="Timed out"
              HEADLINE="GitHub Pages deploy timed out"
              DISCORD_COLOR="16753920"
              ;;
            *)
              EMOJI="❌"
              STATUS_LABEL="Failed"
              HEADLINE="GitHub Pages deploy failed"
              DISCORD_COLOR="15684740"
              ;;
          esac

          if [ -n "$REPO_HOMEPAGE" ]; then
            SITE_URL="$REPO_HOMEPAGE"
          elif [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            SITE_URL="https://${OWNER}.github.io/"
          else
            SITE_URL="https://${OWNER}.github.io/${REPO_NAME}/"
          fi

          SHORT_SHA="$(printf '%s' "$SHA" | cut -c1-7)"
          SHORT_SHA="${SHORT_SHA:-unknown}"
          COMMIT_URL="${REPO_URL}/commit/${SHA}"
          COMMIT_TITLE="$(printf '%s' "$TITLE" | tr '\n' ' ' | sed 's/  */ /g')"
          if [ ${#COMMIT_TITLE} -gt 120 ]; then
            COMMIT_TITLE="${COMMIT_TITLE:0:117}..."
          fi
          COMMIT_TITLE="${COMMIT_TITLE:-Deploy}"

          DURATION_LABEL="unknown"
          if [ -n "$RUN_STARTED_AT" ] && [ -n "$UPDATED_AT" ]; then
            start_epoch=$(date -u -d "$RUN_STARTED_AT" +%s 2>/dev/null)
            end_epoch=$(date -u -d "$UPDATED_AT" +%s 2>/dev/null)
            if [ -n "$start_epoch" ] && [ -n "$end_epoch" ]; then
              secs=$((end_epoch - start_epoch))
              if [ "$secs" -lt 0 ]; then secs=0; fi
              mins=$((secs / 60))
              rem=$((secs % 60))
              if [ "$mins" -gt 0 ]; then
                DURATION_LABEL="${mins}m ${rem}s"
              else
                DURATION_LABEL="${rem}s"
              fi
            fi
          fi

          WHEN_LABEL="$(date -u -d "$UPDATED_AT" "+%d %b %Y, %H:%M UTC" 2>/dev/null)"
          if [ -z "$WHEN_LABEL" ]; then
            WHEN_LABEL="$(date -u "+%d %b %Y, %H:%M UTC")"
          fi

          TRIGGER_LABEL="$TRIGGER"
          if [ "$TRIGGER" = "workflow_dispatch" ]; then
            TRIGGER_LABEL="manual"
          fi
          TRIGGER_LABEL="${TRIGGER_LABEL:-unknown}"

          ATTEMPT_NOTE=""
          if [ -n "$RUN_ATTEMPT" ] && [ "$RUN_ATTEMPT" -gt 1 ] 2>/dev/null; then
            ATTEMPT_NOTE=" (attempt ${RUN_ATTEMPT})"
          fi

          if [ "$CONCLUSION" = "success" ]; then
            TITLE_URL="$SITE_URL"
            DISABLE_PREVIEW=false
          else
            TITLE_URL="$RUN_URL"
            DISABLE_PREVIEW=true
          fi

          telegram_text="${EMOJI} <b>$(html_escape "$HEADLINE")</b>$(html_escape "$ATTEMPT_NOTE")"
          telegram_text+=$'\n\n'
          telegram_text+="📦 <b>Project:</b> $(html_escape "$REPO_FULL_NAME")"$'\n'
          telegram_text+="🌿 <b>Branch:</b> <code>$(html_escape "$BRANCH")</code>"$'\n'
          telegram_text+="📝 <b>Commit:</b> <a href=\"$(html_escape "$COMMIT_URL")\"><code>$(html_escape "$SHORT_SHA")</code></a> $(html_escape "$COMMIT_TITLE")"$'\n'
          telegram_text+="👤 <b>By:</b> $(html_escape "$ACTOR")"$'\n'
          telegram_text+="⚡ <b>Trigger:</b> $(html_escape "$TRIGGER_LABEL")"$'\n'
          telegram_text+="⏱ <b>Duration:</b> $(html_escape "$DURATION_LABEL")"$'\n'
          telegram_text+="📅 <b>When:</b> $(html_escape "$WHEN_LABEL")"$'\n'
          telegram_text+="🌐 <b>Live site:</b> $(html_escape "$SITE_URL")"$'\n'
          telegram_text+="🔗 <a href=\"$(html_escape "$RUN_URL")\">View workflow run</a>"

          echo "Deploy ${STATUS_LABEL}: ${REPO_FULL_NAME} @ ${BRANCH} (${SHORT_SHA}) in ${DURATION_LABEL}"

          sent_any=0

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            telegram_payload=$(jq -n \
              --arg chat_id "$TELEGRAM_CHAT_ID" \
              --arg text "$telegram_text" \
              --argjson disable_web_page_preview "$DISABLE_PREVIEW" \
              '{
                chat_id: $chat_id,
                text: $text,
                parse_mode: "HTML",
                disable_web_page_preview: $disable_web_page_preview
              }')
            http=$(curl -sS -o /tmp/telegram-response.json -w "%{http_code}" \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              --data "$telegram_payload")
            if [ "$http" = "200" ]; then
              echo "Telegram: sent"
              sent_any=1
            else
              echo "Telegram: send failed (HTTP ${http:-none}); continuing"
            fi
          else
            echo "Telegram: skipped (TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID not set)"
          fi

          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            discord_payload=$(jq -n \
              --arg username "GitHub Pages" \
              --arg title "${EMOJI} ${HEADLINE}" \
              --arg url "$TITLE_URL" \
              --argjson color "$DISCORD_COLOR" \
              --arg author_name "$REPO_FULL_NAME" \
              --arg author_url "$REPO_URL" \
              --arg author_icon "https://github.com/${OWNER}.png" \
              --arg description "$COMMIT_TITLE" \
              --arg branch "\`${BRANCH}\`" \
              --arg commit "[${SHORT_SHA}](${COMMIT_URL})" \
              --arg actor "$ACTOR" \
              --arg duration "$DURATION_LABEL" \
              --arg trigger "$TRIGGER_LABEL" \
              --arg when "$WHEN_LABEL" \
              --arg site "$SITE_URL" \
              --arg workflow "[Open run](${RUN_URL})" \
              --arg timestamp "$UPDATED_AT" \
              --arg footer "GitHub Pages · ${STATUS_LABEL}${ATTEMPT_NOTE}" \
              '{
                username: $username,
                allowed_mentions: {parse: []},
                embeds: [{
                  title: $title,
                  url: $url,
                  color: $color,
                  description: $description,
                  author: {
                    name: $author_name,
                    url: $author_url,
                    icon_url: $author_icon
                  },
                  fields: [
                    {name: "Branch", value: $branch, inline: true},
                    {name: "Commit", value: $commit, inline: true},
                    {name: "Triggered by", value: $actor, inline: true},
                    {name: "Duration", value: $duration, inline: true},
                    {name: "Trigger", value: $trigger, inline: true},
                    {name: "When", value: $when, inline: true},
                    {name: "Live site", value: $site, inline: false},
                    {name: "Workflow", value: $workflow, inline: false}
                  ],
                  timestamp: $timestamp,
                  footer: {text: $footer}
                }]
              }')
            http=$(curl -sS -o /tmp/discord-response.json -w "%{http_code}" \
              -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              --data "$discord_payload")
            if [ "$http" = "204" ] || [ "$http" = "200" ]; then
              echo "Discord: sent"
              sent_any=1
            else
              echo "Discord: send failed (HTTP ${http:-none}); continuing"
            fi
          else
            echo "Discord: skipped (DISCORD_WEBHOOK_URL not set)"
          fi

          if [ "$sent_any" -eq 0 ]; then
            echo "No notification channels configured, or every send was skipped."
          fi

          exit 0
